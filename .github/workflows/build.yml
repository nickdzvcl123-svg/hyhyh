name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Xcode project
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Files in repository ==="
          find . -maxdepth 4 -type f | sort

          PROJECT=$(find . -name "*.xcodeproj" -type d | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Không tìm thấy file .xcodeproj"
            echo "Hãy kiểm tra repository đã upload đầy đủ Xcode project chưa."
            exit 1
          fi

          echo "Found project: $PROJECT"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Locate scheme
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Available schemes ==="
          xcodebuild -list -project "$PROJECT"

          SCHEME=$(xcodebuild -list \
            -project "$PROJECT" |
            sed -n '/Schemes:/,/^$/p' |
            sed '1d' |
            sed '/^[[:space:]]*$/d' |
            head -n 1 |
            xargs)

          if [ -z "$SCHEME" ]; then
            echo "ERROR: Không tìm thấy Scheme."
            exit 1
          fi

          echo "Found scheme: $SCHEME"
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"

      - name: Build iOS
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Create IPA
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH=$(find build/Build/Products \
            -name "*.app" \
            -type d |
            head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Không tìm thấy .app sau khi build."
            exit 1
          fi

          echo "App found: $APP_PATH"

          rm -rf Payload
          mkdir Payload

          cp -R "$APP_PATH" Payload/

          zip -r GNNKeyGate.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GNNKeyGate-IPA
          path: GNNKeyGate.ipa
